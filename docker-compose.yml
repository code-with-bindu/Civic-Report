version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: civic-report-db
    environment:
      POSTGRES_USER: civic_user
      POSTGRES_PASSWORD: civic_password
      POSTGRES_DB: civic_report
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic_user -d civic_report"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
